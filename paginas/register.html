<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empreenda+ Elas - Cadastro</title>
    <link rel="stylesheet" href="../css/register.css">
 
</head>
<body>

    <div class="login-container">
        <!-- Lado Esquerdo: Imagem e Texto Motivacional -->
        <div class="banner-side">
            <div class="logo-box">
                <div class="logo-circle"></div>
                <span class="logo-brand">EMPREENDA<br>MAIS ELAS</span>
            </div>
            <h1 class="banner-headline">O SUCESSO É CONSTRUÍDO JUNTAS.</h1>
            <p class="banner-subtext">Junte-se à comunidade que eleva mulheres empreendedoras.</p>
        </div>

        <!-- Lado Direito: Formulário de Cadastro -->
        <div class="form-side">
            <div class="form-wrapper">
                <h2 class="welcome-title">Crie sua conta para começar</h2>

                <div class="tabs-container">
                    <button class="tab-btn">Entrar</button>
                    <button class="tab-btn active">Cadastrar</button>
                </div>

                <form>
                    <!-- Campo Nome -->
                    <div class="input-group">
                        <div class="input-field-wrapper">
                            <input type="text" class="input-field" placeholder="seu nome" required>
                        </div>
                    </div>

                    <!-- Campo E-mail -->
                    <div class="input-group">
                        <div class="input-field-wrapper">
                            <input type="email" class="input-field" placeholder="seu email" required>
                        </div>
                    </div>

                    <!-- Campo Senha -->
                    <div class="input-group has-icon">
                        <div class="input-field-wrapper">
                            <span class="input-icon">&#128274;</span>
                            <input type="password" class="input-field" placeholder="sua senha" required>
                            <span class="toggle-password">&#128065;</span>
                        </div>
                    </div>

                    <!-- Campo Confirmar Senha -->
                    <div class="input-group has-icon">
                        <div class="input-field-wrapper">
                            <span class="input-icon">&#128274;</span>
                            <input type="password" class="input-field" placeholder="confirmar sua senha" required>
                            <span class="toggle-password">&#128065;</span>
                        </div>
                    </div>

                    <!-- Botão Entrar (Mantido como "Entrar" conforme o botão do layout do Figma) -->
                    <button type="submit" class="btn-submit">Entrar</button>

                    <!-- Divisor -->
                    <div class="divider">OU CADASTRAR COM</div>

                    <!-- Provedores Sociais -->
                    <div class="social-container">
                        <button type="button" class="btn-social">
                            <span>G</span> Google
                        </button>
                        <button type="button" class="btn-social">
                            <span>f</span> Facebook
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Rodapé -->
    <footer class="footer-bar">
        <div class="footer-links">
            <a href="#">Sobre</a>
            <a href="#">Políticas de Privacidade</a>
            <a href="#">Termos e serviços</a>
            <a href="#">Contato e Suporte</a>
        </div>
        <div>
            &copy; 2026 Empreenda Mais Elas
        </div>
    </footer>

</body>
</html>
